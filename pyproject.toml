[project]
name = "steepserver"
version = "0.1.0"
description = "Powder: self-hosted stand-in for Steep's online services, to keep an owned copy playable"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
]

[project.scripts]
steepserver = "steepserver.__main__:main"
steep-launcher = "steeplauncher.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steepserver", "steeplauncher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
