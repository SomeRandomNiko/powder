# Copy to config.toml and adjust. Every setting is optional (these are the defaults).

[server]
bind = "127.0.0.1"          # this PC only. For friends on the local network: "0.0.0.0" and public_host
                            # below (the launcher's "Host for others" does this, plus the firewall rule)
public_host = "127.0.0.1"   # address the games use to reach this server (this PC's LAN address for friends)
https_port = 443           # HTTPS for the game and Ubisoft Connect, incl. Connect's demux (routed by hostname)
nex_port = 6005
storm_port = 11000          # peer-to-peer helpers (UDP): NAT detection 11000-11003, traversal 11005
crl_port = 80               # revocation list for the local CA (http://public-ubiservices.ubi.com/powder-ca.crl)
connect_cloud_saves = false # true: Ubisoft Connect keeps the game's save files (tutorial, story, settings) on
                            # this server, so they follow your account to another PC
data_dir = "data"           # database, logs, uploaded game logs, generated TLS cert + NEX signing key
gamedata_dir = "gamedata"   # the game-data pack (optional; not in the repository, see README)
use_gamedata = true         # false: ignore an installed pack (the launcher's checkbox uses `run --no-gamedata`)
recordings_dir = "recordings"   # your own recorded sessions; only read by `gamedata build` and `admin import`
country = "US"              # what Ubisoft Connect is told about the player's location
region = "NA"
log_level = "INFO"
strict_tickets = false      # true: refuse requests with tickets the server did not issue

[players]
# Players sign in with accounts (registered in the launcher). Only while a server has no account yet:
# default = "<profile id>"  # the player every login becomes. Unset: the imported player, or else the
#                           # first player, created on the first login. The first account takes it over.
# [players.bind]            # (legacy, before accounts) a client IP -> its own player
# "192.168.1.20" = "<profile id>"

[multiplayer]
storm = "powder"            # "powder": this server is the games' peer-to-peer helper (Storm: NAT detection
                            # and traversal, on storm_port); "off": none, and the game switches multiplayer off
# pretend_online = ["SomePlayer"]  # testing invites alone: these players look online in Steep

[gameplay]
unlimited_heli_tickets = false   # (planned)
starting_credits = 0             # credits for newly created players
unlock_all = false               # (planned)
xp_multiplier = 1.0              # (planned, phase 2)
free_purchases = false           # shop purchases do not cost credits
reward_credit_multiplier = 1.0   # scale credits from challenge rewards

# Per-player overrides:
# [gameplay.player."<profile id>"]
# free_purchases = true

[plugins]
enabled = ["*"]             # plugin file names (without .py) in ./plugins, "*" = all
disabled = []
