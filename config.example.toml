# Copy to config.toml and adjust. Every setting is optional (these are the defaults).

[server]
bind = "127.0.0.1"          # this PC only. For friends on a LAN/VPN: "0.0.0.0" and public_host below
                            # (Windows then asks once whether to allow Powder through the firewall)
public_host = "127.0.0.1"   # address the game uses to reach this server (LAN/VPN IP for friends)
https_port = 443           # HTTPS for the game and Ubisoft Connect, incl. Connect's demux (routed by hostname)
nex_port = 6005
crl_port = 80               # revocation list for the local CA (http://public-ubiservices.ubi.com/powder-ca.crl)
connect_cloud_saves = false # false: Ubisoft Connect treats games as having no cloud saves (no sync prompts)
data_dir = "data"           # database, logs, uploaded game logs, generated TLS cert + NEX signing key
gamedata_dir = "gamedata"   # the game-data pack (not in the repository, see README)
recordings_dir = "recordings"   # your own recorded sessions; only read by `gamedata build` and `admin import`
country = "US"              # what Ubisoft Connect is told about the player's location
region = "NA"
log_level = "INFO"
strict_tickets = false      # true: refuse requests with tickets the server did not issue

[players]
# default = "<profile id>"  # player used when a login cannot be told apart. Unset: the imported player,
#                           # or else the first player, created as a new account on the first login.
# Map friends' machines to their own player (profile id), by the IP the server sees:
# [players.bind]
# "192.168.1.20" = "<profile id>"

[gameplay]
unlimited_heli_tickets = false   # (planned)
starting_credits = 0             # credits for newly created players
unlock_all = false               # (planned)
xp_multiplier = 1.0              # (planned, phase 2)
free_purchases = false           # shop purchases do not cost credits
reward_credit_multiplier = 1.0   # scale credits from challenge rewards

# Per-player overrides:
# [gameplay.player."<profile id>"]
# free_purchases = true

[plugins]
enabled = ["*"]             # plugin file names (without .py) in ./plugins, "*" = all
disabled = []
